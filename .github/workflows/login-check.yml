name: login-check
on: {push: {branches: [ci/login-check]}}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.48.2 serve-handler@6 && npx playwright install --with-deps chromium
      - run: |
          node -e "const h=require('serve-handler');require('http').createServer((q,r)=>h(q,r,{public:'dist/portfolio/browser',rewrites:[{source:'**',destination:'/index.html'}],cleanUrls:true})).listen(4300)" &
          sleep 2
          node ci-tmp/t.cjs http://localhost:4300 > out.txt 2>&1 || true
          echo "::notice title=out::$(cat out.txt | tr "\n" "~" | sed "s/%/%25/g")"
